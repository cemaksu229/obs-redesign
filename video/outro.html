<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pusula</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(120% 120% at 50% 0%, #1d3f86 0%, #14306b 45%, #0b1b3d 100%);
    color: #fff; font-family: 'Inter', system-ui, sans-serif;
  }
  .wrap { text-align: center; }
  svg { width: 132px; height: 132px; opacity: 0; transform: rotate(-40deg) scale(.8); animation: spin 1100ms cubic-bezier(.2,.8,.2,1) forwards; }
  h1 { font-size: 92px; letter-spacing: -0.04em; margin: 18px 0 6px; font-weight: 700; opacity: 0; animation: fade 700ms 400ms forwards; }
  p { margin: 0; font-size: 30px; color: rgba(255,255,255,.82); opacity: 0; animation: fade 700ms 800ms forwards; }
  .url { margin-top: 34px; font-size: 22px; color: #f6d48a; letter-spacing: .01em; opacity: 0; animation: fade 700ms 1300ms forwards; }
  @keyframes spin { to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
</style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="none" stroke="#fff" stroke-width="2" />
      <path d="M16 5.5 19.4 16 16 26.5 12.6 16Z" fill="#fff" opacity="0.3" />
      <path d="M16 5.5 19.4 16h-6.8Z" fill="#e3a21a" />
      <circle cx="16" cy="16" r="1.8" fill="#fff" />
    </svg>
    <h1>Pusula</h1>
    <p>Plan once. Register without the race.</p>
    <div class="url">cemaksu229.github.io/obs-redesign</div>
  </div>
</body>
</html>
