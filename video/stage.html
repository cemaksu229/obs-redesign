<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pusula on phone</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; gap: 72px;
    background: radial-gradient(120% 120% at 50% 0%, #1d3f86 0%, #14306b 45%, #0b1b3d 100%);
    font-family: 'Inter', system-ui, sans-serif; overflow: hidden;
  }
  .phone {
    width: 280px; height: 606px; padding: 12px; border-radius: 46px;
    background: #0d1117; box-shadow: 0 40px 80px -30px rgba(0,0,0,.7), inset 0 0 0 2px #2a3242;
    opacity: 0; transform: translateY(40px);
    animation: up 900ms cubic-bezier(.2,.8,.2,1) forwards;
  }
  .phone:nth-child(2) { animation-delay: 350ms; }
  .screen { width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: #fff; position: relative; }
  /* 390 px genişliğindeki telefon görünümünü küçülterek gösteriyoruz */
  iframe { width: 390px; height: 844px; border: 0; transform: scale(0.7179); transform-origin: 0 0; }
  .label { color: rgba(255,255,255,.75); text-align: center; margin-top: 18px; font-size: 18px; letter-spacing: .01em; }
  @keyframes up { to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div>
    <div class="phone"><div class="screen"><iframe src="http://localhost:4173/?theme=light#/" title="Light"></iframe></div></div>
    <p class="label">Light</p>
  </div>
  <div>
    <div class="phone"><div class="screen"><iframe src="http://localhost:4173/?theme=dark#/program" title="Dark"></iframe></div></div>
    <p class="label">Dark</p>
  </div>
</body>
</html>
